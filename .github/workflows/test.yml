name: Verify Cascade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Static checks and unit tests
        run: |
          bash -n install.sh tests/install-smoke.sh
          shellcheck install.sh tests/install-smoke.sh
          python3 -m unittest discover -s tests -v
          python3 -m py_compile cascade.py tests/integration.py
          python3 tests/check_integrity.py
      - name: Install, systemd, reinstall, uninstall
        run: bash tests/install-smoke.sh
      - name: Real TCP and UDP network namespaces
        if: always()
        run: sudo python3 tests/integration.py
  debian:
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Debian systemd container
        run: |
          docker build --build-arg DEBIAN_VERSION=${{ matrix.version }} -t cascade-test -f tests/Dockerfile.debian .
          docker run -d --name cascade-test --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/src:ro" -w /src cascade-test
          for i in $(seq 1 30); do
            docker exec cascade-test systemctl is-system-running && break
            sleep 1
          done
      - name: Debian unit, install and reload tests
        run: |
          docker exec cascade-test python3 -m unittest discover -s tests -v
          docker exec cascade-test bash tests/install-smoke.sh
      - name: Debian network namespaces
        if: always()
        run: docker exec cascade-test python3 tests/integration.py
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs cascade-test || true
          docker rm -f cascade-test || true
